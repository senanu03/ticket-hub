spring:
  application:
    name: event-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/snap_seat?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}

tickethub:
  security:
    jwt-secret: ${JWT_SECRET:SnapSeatVersion1JwtSecretKeyForTesting123456}

logging:
  level:
    root: INFO
    com.tp.snapseat.event_service: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when_authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:9091/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
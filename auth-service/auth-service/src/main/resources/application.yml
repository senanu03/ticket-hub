server:
  port: 8082

spring:
  application:
    name: auth-service

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:9091/eureka/}
  instance:
    prefer-ip-address: true

tickethub:
  security:
    jwt-secret: ${JWT_SECRET:SnapSeatVersion1JwtSecretKeyForTesting123456}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
server:
  port: 8084

spring:
  application:
    name: booking-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tp_snapseat_booking?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  cloud:
    circuitbreaker:
      resilience4j:
        disableTimeLimiter: true

    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:9091/eureka/}
  instance:
    prefer-ip-address: true

event:
  service:
    url: ${EVENT_SERVICE_URL:http://localhost:8081}

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8983}

tickethub:
  security:
    jwt-secret: ${JWT_SECRET:SnapSeatVersion1JwtSecretKeyForTesting123456}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

booking:
  reservation:
    expiry: ${BOOKING_EXPIRY:10m}
    max-seats-per-booking: 10
    expiry-batch-size: 100
    expiry-scan-interval-ms: 30000

  events:
    enabled: true
    booking-confirmed-topic: booking.confirmed

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

  tags:
    application: ${spring.application.name}

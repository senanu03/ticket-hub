services:
  # =========================================================================
  # 1. Infrastructure: MySQL 8.0
  # =========================================================================
  mysql:
    image: mysql:8.0
    container_name: tickethub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - tickethub-network

  # =========================================================================
  # 2. Infrastructure: Apache Kafka (KRaft mode, no Zookeeper dependency)
  # =========================================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: tickethub-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - tickethub-network

  # =========================================================================
  # 3. Observability: ELK Stack (Elasticsearch, Logstash, Kibana) + Zipkin
  # =========================================================================
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: tickethub-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - tickethub-network

  logstash:
    image: logstash:8.12.0
    container_name: tickethub-logstash
    restart: unless-stopped
    ports:
      - "5001:5000/tcp"
      - "5044:5044"
    volumes:
      - ./docker/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tickethub-network

  kibana:
    image: kibana:8.12.0
    container_name: tickethub-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tickethub-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: tickethub-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - tickethub-network

  # =========================================================================
  # 4. Service Discovery (Eureka)
  # =========================================================================
  service-discovery:
    build:
      context: ./service-discovery
    container_name: tickethub-service-discovery
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      SERVER_PORT: 9091
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - tickethub-network

  # =========================================================================
  # 5. Core Microservices
  # =========================================================================
  auth-service:
    build:
      context: ./auth-service/auth-service
    container_name: tickethub-auth-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      EUREKA_SERVER_URL: http://service-discovery:9091/eureka/
      JWT_SECRET: SnapSeatVersion1JwtSecretKeyForTesting123456
    depends_on:
      service-discovery:
        condition: service_healthy
    networks:
      - tickethub-network

  event-service:
    build:
      context: ./event-service/event-service-updated-fixed
    container_name: tickethub-event-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/snap_seat?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_SERVER_URL: http://service-discovery:9091/eureka/
      FLYWAY_ENABLED: "false"
      JWT_SECRET: SnapSeatVersion1JwtSecretKeyForTesting123456
    depends_on:
      mysql:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - tickethub-network

  booking-service:
    build:
      context: ./booking-service
    container_name: tickethub-booking-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:mysql://mysql:3306/tp_snapseat_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://service-discovery:9091/eureka/
      EVENT_SERVICE_URL: http://event-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8983
      JWT_SECRET: SnapSeatVersion1JwtSecretKeyForTesting123456
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - tickethub-network

  payment-service:
    build:
      context: ./payment-service/TicketHub_Payment_Microservice_Phase1_MySQL/tickethub-payment-service
    container_name: tickethub-payment-service
    restart: unless-stopped
    ports:
      - "8983:8983"
    environment:
      SERVER_PORT: 8983
      DB_URL: jdbc:mysql://mysql:3306/tickethub_payment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://service-discovery:9091/eureka/
      BOOKING_SERVICE_URL: http://booking-service:8084
      JWT_SECRET: SnapSeatVersion1JwtSecretKeyForTesting123456
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - tickethub-network

  notification-service:
    build:
      context: ./notification-service/notification-service
    container_name: tickethub-notification-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/tickethub_notification?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://service-discovery:9091/eureka/
      BOOKING_SERVICE_URL: http://booking-service:8084
      NOTIFICATION_MAIL_SIMULATE: "true"
      JWT_SECRET: SnapSeatVersion1JwtSecretKeyForTesting123456
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - tickethub-network

  # =========================================================================
  # 6. API Gateway (Single Entry Point)
  # =========================================================================
  api-gateway:
    build:
      context: ./api-gateway
    container_name: tickethub-api-gateway
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      EUREKA_SERVER_URL: http://service-discovery:9091/eureka/
    depends_on:
      service-discovery:
        condition: service_healthy
    networks:
      - tickethub-network

networks:
  tickethub-network:
    driver: bridge

volumes:
  mysql-data:
  es-data:

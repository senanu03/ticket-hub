input {
  tcp {
    port => 5000
    codec => json_lines
  }
  beats {
    port => 5044
  }
}

filter {
  if [message] =~ "^\s*\{.*\}\s*$" {
    json {
      source => "message"
    }
  }

  mutate {
    add_field => { "cluster" => "tickethub-local" }
  }

  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "tickethub-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}

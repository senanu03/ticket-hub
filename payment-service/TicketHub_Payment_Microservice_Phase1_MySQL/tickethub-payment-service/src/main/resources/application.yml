server:
  port: 8983

spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tickethub_payment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000

booking-service:
  base-url: ${BOOKING_SERVICE_URL:http://localhost:8084}
  connect-timeout-ms: ${BOOKING_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${BOOKING_READ_TIMEOUT_MS:2000}

tickethub:
  security:
    jwt-secret: ${JWT_SECRET:SnapSeatVersion1JwtSecretKeyForTesting123456}
    service-token-expiration-ms: ${SERVICE_TOKEN_EXPIRATION_MS:300000}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_TkWdBpFd3EICGx}
  key-secret: ${RAZORPAY_KEY_SECRET:lo6MkC5Aw2zQQqZnOZ3pMV7K}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:tickethub@123}

resilience4j:
  retry:
    instances:
      bookingService:
        max-attempts: 2
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.tickethub.payment.exception.BookingServiceException

  circuitbreaker:
    instances:
      bookingService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:9091/eureka/}
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
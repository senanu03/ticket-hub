spring:
  datasource:
    url: jdbc:h2:mem:paymentdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    admin:
      auto-create: false
      fail-fast: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

tickethub:
  security:
    jwt-secret: SnapSeatVersion1JwtSecretKeyForTesting123456

razorpay:
  key-id: test_key
  key-secret: test_secret
  webhook-secret: test_webhook
